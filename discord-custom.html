<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discord Custom</title>
<style>
:root{--bg:#050505;--fg:#f5f5f5;--mut:rgba(245,245,245,.55);--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--line:rgba(255,255,255,.18);--hi:rgba(255,255,255,.35);--blob:rgba(255,255,255,.16);--sh:rgba(0,0,0,.5);box-sizing:border-box}
:root[data-theme=light]{--bg:#f2f2f2;--fg:#0a0a0a;--mut:rgba(10,10,10,.55);--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.85);--line:rgba(0,0,0,.12);--hi:rgba(255,255,255,.95);--blob:rgba(0,0,0,.13);--sh:rgba(0,0,0,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));transition:background .5s,color .5s;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;background:radial-gradient(circle,var(--blob),transparent 68%);will-change:transform;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{width:460px;height:460px;top:-90px;left:-80px}
.b2{width:380px;height:380px;bottom:8%;right:-70px;animation-delay:-6s}
.b3{width:300px;height:300px;top:45%;left:30%;animation-delay:-12s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.25)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 34px var(--sh);border-radius:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;margin-bottom:14px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
h1{font-size:clamp(22px,6vw,32px);font-weight:800;letter-spacing:-.03em;background:linear-gradient(100deg,var(--fg) 30%,var(--mut) 50%,var(--fg) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.sub{color:var(--mut);font-size:13px;margin-top:4px;line-height:1.45}
.ctl{display:flex;gap:8px;flex-shrink:0}
select,.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(14px);transition:transform .25s,background .25s}
select:focus-visible,.btn:focus-visible,.row:focus-visible,.pill:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
select option{background:#111;color:#fff}
.btn:active,.pill:active,.row:active{transform:scale(.96)}
.bar{position:sticky;top:8px;z-index:5;padding:12px;margin-bottom:14px;animation:rise .9s .12s cubic-bezier(.2,.8,.2,1) both}
input{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:box-shadow .3s}
input::placeholder{color:var(--mut)}
input:focus{box-shadow:0 0 0 4px var(--glass2)}
.styles{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center}
.styles::-webkit-scrollbar{display:none}
.lbl{font-size:12px;color:var(--mut);flex-shrink:0}
.pill{flex-shrink:0;font:inherit;font-size:13px;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:background .3s,transform .25s,color .3s}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tip{font-size:12.5px;color:var(--mut);padding:0 6px 14px;line-height:1.5}
.cat.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--glass2)}
.cat{margin-bottom:14px;padding:14px;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ctitle{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ccode{font-size:11px;color:var(--mut);margin-top:2px}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.row{position:relative;overflow:hidden;text-align:left;font:inherit;font-size:14px;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .3s;word-break:break-word}
.row::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,var(--hi) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.row:hover{transform:translateY(-2px);background:var(--glass2);box-shadow:0 8px 20px var(--sh)}
.row:hover::after{transform:translateX(120%)}
.row.ok{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.04);background:var(--fg);color:var(--bg)}}
.empty{text-align:center;color:var(--mut);padding:40px 0}
#toast{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:9;padding:11px 20px;border-radius:999px;font-size:13px;transition:.4s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .4s}
#modal.open{opacity:1;pointer-events:auto}
.mcard{width:100%;max-width:420px;padding:22px;transform:translateY(30px) scale(.94);transition:transform .5s cubic-bezier(.2,.8,.2,1);background:var(--glass2)}
#modal.open .mcard{transform:none}
.mcard h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.mcard{max-width:720px;height:min(86vh,760px);display:flex;flex-direction:column;padding:18px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mcard h2{margin-bottom:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:2px;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
#tl{overflow-y:auto;flex:1;padding-right:2px}
.gh{font-size:13px;color:var(--mut);margin:14px 2px 8px;font-weight:600}
.tu{background:var(--glass);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:background .3s}
.tu[open]{background:var(--glass2)}
.tu summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:11px 13px;font-size:14px;font-weight:600}
.tu summary::-webkit-details-marker{display:none}
.tu .n{flex-shrink:0;min-width:28px;height:24px;padding:0 6px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12px;display:grid;place-items:center}
.tu p{padding:0 14px 13px;font-size:13.5px;line-height:1.6;color:var(--mut);animation:stepin .4s both}
@keyframes stepin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media(max-width:520px){header{flex-direction:column;align-items:stretch}.ctl select{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

["Kustomisasi & Boost",[
["Upload emoji kustom","Server Settings → Emoji → Upload Emoji. Maks 256 KB, gambar persegi paling bagus."],

];
const $=id=>document.getElementById(id);
const st={l:"en",s:0,t:"dark",g:-1};
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
if(T[get("dc_l")])st.l=get("dc_l");
if(get("dc_s")!==null&&S[+get("dc_s")])st.s=+get("dc_s");
st.t=get("dc_t")||"dark";

let tt;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),1600)}
async function copy(text,el){
  try{await navigator.clipboard.writeText(text)}catch(e){
    const a=document.createElement("textarea");a.value=text;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();
    try{document.execCommand("copy")}catch(_){}a.remove();
  }
  if(el){el.classList.remove("ok");void el.offsetWidth;el.classList.add("ok")}
  toast(T[st.l].ok+"  "+(text.length>40?text.slice(0,40)+"…":text.replace(/\n/g," · ")));
}

function pills(){
  $("pills").innerHTML=S.map((f,i)=>`<button class="pill${i===st.s?" on":""}" data-i="${i}">${f("👋","welcome")}</button>`).join("");
  $("pills").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{st.s=+b.dataset.i;set("dc_s",st.s);pills();render(false)});
}

function render(anim=true){
  const L=T[st.l],q=$("q").value.trim().toLowerCase(),f=S[st.s];
  let out="",n=0;
  D.forEach((cat,ci)=>{
    const items=cat.filter(([e,name])=>!q||name.toLowerCase().includes(q));
    if(!items.length)return;
    n+=items.length;
    const lines=items.map(([e,name])=>f(e,name));
    out+=`<section class="cat glass" style="${anim?`animation-delay:${.15+ci*.07}s`:"animation:none"}">
      <div class="chead"><div><div class="ctitle">${L.c[ci]}</div><div class="ccode" data-h="${H(EN[ci])}" style="cursor:pointer">${H(EN[ci])}</div></div>
      <button class="btn" data-all="${ci}">${L.all}</button></div>
      <div class="rows">${lines.map((t,i)=>`<button class="row" data-t="${t}">${t}</button>`).join("")}</div></section>`;
  });
  $("list").innerHTML=out||`<p class="empty">${L.no}</p>`;
  $("list").querySelectorAll(".row").forEach(b=>b.onclick=()=>copy(b.dataset.t,b));
  $("list").querySelectorAll(".ccode").forEach(b=>b.onclick=()=>copy(b.dataset.h,null));
  $("list").querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.all;
    const t=D[ci].filter(([e,name])=>!q||name.toLowerCase().includes(q)).map(([e,name])=>f(e,name)).join("\n");
    copy(t,null);
  });
}

function ui(){
  const L=T[st.l];
  document.documentElement.lang=st.l;
  $("sub").textContent=L.sub;$("q").placeholder=L.q;$("slbl").textContent=L.st;$("tip").textContent=L.tip;
  document.documentElement.dataset.theme=st.t;
  const B=TL[st.l];
  $("mt").textContent=B[0];$("sq").placeholder=B[1];$("tut").title=B[0];
  $("snote").textContent=(st.l==="en"||st.l==="id")?"":B[3];
  if($("modal").classList.contains("open"))tuts();
}
function tuts(){
  const B=TL[st.l],src=st.l==="id"?GI:GE,q=$("sq").value.trim().toLowerCase();
  $("chips").innerHTML=[B[2],...src.map(g=>g[0])].map((n,i)=>`<button class="pill${i-1===st.g?" on":""}" data-g="${i-1}">${n}</button>`).join("");
  $("chips").querySelectorAll(".pill").forEach(b=>b.onclick=()=>{st.g=+b.dataset.g;tuts()});
  let k=0,out="";
  src.forEach((g,gi)=>{
    const base=k;k+=g[1].length;
    if(st.g>=0&&st.g!==gi)return;
    const it=g[1].map((x,i)=>[base+i+1,x]).filter(([n,x])=>!q||(x[0]+" "+x[1]).toLowerCase().includes(q));
    if(!it.length)return;
    out+=`<h3 class="gh">${g[0]}</h3>`+it.map(([n,x])=>`<details class="tu"><summary><span class="n">${n}</span>${x[0]}</summary><p>${x[1]}</p></details>`).join("");
  });
  $("tl").innerHTML=out||`<p class="empty">${T[st.l].no}</p>`;
}
function modal(o){
  const m=$("modal");m.classList.toggle("open",o);m.setAttribute("aria-hidden",!o);
  if(o){tuts();$("sq").focus({preventScroll:true})}
}

$("lang").innerHTML=Object.keys(T).map(k=>`<option value="${k}">${T[k].n}</option>`).join("");
$("lang").value=st.l;
$("lang").onchange=e=>{st.l=e.target.value;set("dc_l",st.l);ui();render(false)};
$("theme").onclick=()=>{st.t=st.t==="dark"?"light":"dark";set("dc_t",st.t);ui()};
$("q").oninput=()=>render(false);
$("tut").onclick=()=>modal(true);
$("mx").onclick=()=>modal(false);
$("sq").oninput=tuts;
$("modal").onclick=e=>{if(e.target.id==="modal")modal(false)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")modal(false)});
ui();pills();render();
</script>
</body>
</html>
